name: Android 5 Tailscale test APK

on:
  workflow_dispatch:
  push:
    branches: [codex/android5-tsnet-fix]

permissions:
  contents: read

concurrency:
  group: android5-test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - name: Checkout pinned patched sources
        run: git submodule update --init clients/android third_party/tailscale
      - uses: actions/setup-go@v5
        with:
          go-version: 1.25.12
          cache: true
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
      - uses: nttld/setup-ndk@v1
        id: ndk
        with:
          ndk-version: r28
      - name: Verify patch and formatting
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          test -z "$(gofmt -l cmd/internal/build_libbox/main.go third_party/tailscale/tsnet/tsnet.go)"
          grep -q 'case "android":' third_party/tailscale/tsnet/tsnet.go
          go list -m -f '{{.Dir}}' github.com/sagernet/tailscale
      - name: Build ARMv7 API 21 library
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
        run: |
          set -euo pipefail
          make lib_install
          export PATH="$(go env GOPATH)/bin:$PATH"
          go run ./cmd/internal/build_libbox -target android -platform android/arm -legacy-only
          mkdir -p clients/android/app/libs
          cp libbox-legacy.aar clients/android/app/libs/
      - uses: gradle/actions/setup-gradle@v4
      - name: Build separately installable debug APK
        working-directory: clients/android
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon :app:assembleOtherLegacyDebug -PtestAbis=armeabi-v7a
      - name: Collect ARMv7 APK and source provenance
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          cp clients/android/app/build/outputs/apk/otherLegacy/debug/*armeabi-v7a*.apk dist/
          {
            echo "sing-box: $(git rev-parse HEAD)"
            git submodule status clients/android third_party/tailscale
            go version
          } > dist/SOURCES.txt
          (cd dist && sha256sum *.apk > SHA256SUMS)
      - uses: actions/upload-artifact@v4
        with:
          name: SFA-1.13.19-android5-tsnet-test-armv7
          path: dist/
          if-no-files-found: error
